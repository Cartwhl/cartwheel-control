<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Motion list on the left, 3D stage on the right, transport under the stage; on phones the
   list drops below the stage. */
:root {
  --bg: #eef0f3;
  --panel: #f8f9fb;
  --line: #d5d9e0;
  --fg: #1b2028;
  --muted: #5d6573;
  --accent: #2447c4;
  --source: #d4832a;      /* ghost: the reference motion */
  --good: #2f8a55;
  --bad: #b8433a;
  --stage: #dfe3e9;
  --grid: #b9c0cb;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1b1f26; --line: #2c323c; --fg: #e4e7ec; --muted: #9098a6;
    --accent: #7b97ff; --source: #e8a04f; --good: #5cc287; --bad: #e57368;
    --stage: #1e232b; --grid: #3a414d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1b1f26; --line: #2c323c; --fg: #e4e7ec; --muted: #9098a6;
  --accent: #7b97ff; --source: #e8a04f; --good: #5cc287; --bad: #e57368;
  --stage: #1e232b; --grid: #3a414d; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px; box-sizing: border-box;
}
.app { height: 100%; display: grid; grid-template-columns: 280px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 12px 16px; }
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; box-shadow: inset 0 0 0 1px var(--line); }
.sw.ref { background: var(--source); opacity: 0.6; box-shadow: none; }

.rail { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.clips { flex: 1; min-height: 0; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.clip { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; cursor: pointer; background: none; width: 100%; text-align: left; color: inherit; font: inherit; }
.clip:last-child { border-bottom: 0; }
.clip:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.clip[aria-current="true"] { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, transparent); }
.clip:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.clip .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip .dur { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); }

.stats { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; font-size: 12.5px; margin: 0; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }

.main { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.stage { position: relative; flex: 1; min-height: 260px; border-radius: 6px; overflow: hidden; background: var(--stage); border: 1px solid var(--line); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 12px; top: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
.loading.error { z-index: 1; padding: 24px; text-align: center; line-height: 1.5; color: var(--bad); background: var(--stage); }

.transport { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
button.ctl, select.ctl { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px 11px; cursor: pointer; }
button.ctl:hover, select.ctl:hover { border-color: var(--muted); }
button.ctl:disabled { cursor: progress; color: var(--muted); font-variant-numeric: tabular-nums; }
button.ctl:focus-visible, select.ctl:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.ctl[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#play { min-width: 76px; font-weight: 600; }
.scrub { flex: 1; min-width: 160px; accent-color: var(--accent); }
.time { font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.keys { color: var(--muted); font-size: 12px; }

@media (max-width: 760px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; height: auto; }
  .main { order: 1; }
  .rail { order: 2; }
  .stage { height: 62vh; flex: none; }
  .clips { max-height: 340px; }
  .keys { display: none; }
}
</style>

<div class="app">
  <header>
    <h1 id="title"></h1>
    <div class="legend">
      <span><i class="sw" id="sw-robot"></i><span id="lg-robot"></span></span>
      <span><i class="sw ref"></i>Reference motion</span>
      <span id="meta"></span>
    </div>
  </header>

  <aside class="rail">
    <div class="clips" id="clips" role="list" aria-label="Motions"></div>
    <dl class="stats" id="stats"></dl>
  </aside>

  <section class="main">
    <div class="stage" id="stage">
      <div class="hud" id="hud"></div>
      <div class="loading" id="loading">Loading robot and poses…</div>
    </div>
    <div class="transport">
      <button class="ctl" id="play" type="button">Pause</button>
      <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Playback position">
      <span class="time" id="time">0.00 / 0.00 s</span>
      <select class="ctl" id="speed" aria-label="Playback speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>
      </select>
      <button class="ctl" id="ghost" type="button" aria-pressed="true">Reference</button>
      <button class="ctl" id="follow" type="button" aria-pressed="true">Follow</button>
      <button class="ctl" id="mp4" type="button" hidden title="Render this motion from the start as a 1080p, 50 fps MP4 with the current camera">Save MP4</button>
      <span class="keys">Space play · ←/→ step · ↑/↓ motion · drag to orbit</span>
    </div>
  </section>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script>
// Start-up failures (CDN blocked, no WebGL, script errors) show on the stage, not as a blank page.
function viewerFail(msg) {
  const el = document.getElementById("loading");
  if (el.classList.contains("error")) return;
  el.hidden = false;
  el.classList.add("error");
  el.textContent = msg;
}
addEventListener("error", (e) => viewerFail(`Viewer error: ${e.message}`));
addEventListener("unhandledrejection", (e) => viewerFail(`Viewer error: ${e.reason?.message ?? e.reason}`));
setTimeout(() => {
  if (!window.viewerReady)
    viewerFail("The viewer didn't start within 15 s. three.js loads from cdn.jsdelivr.net: check that it isn't blocked, then see the browser console.");
}, 15000);
</script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const pretty = (n) => n.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());

async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r;
}
let manifest, poseBuf, gltf;
try {
  [manifest, poseBuf, gltf] = await Promise.all([
    get("manifest.json").then((r) => r.json()),
    get("poses.bin").then((r) => r.arrayBuffer()),
    new GLTFLoader().loadAsync("robot.glb"),
  ]);
} catch (e) {
  viewerFail(`Couldn't load the viewer data (${e.message}). Serve this folder over HTTP (python -m http.server); opening the file directly won't work.`);
  throw e;
}
const poses = new Int16Array(poseBuf);
const NB = manifest.bodies.length; // per robot; a frame holds the reference, then the policy

// ---------------------------------------------------------------- scene
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.AgXToneMapping; // keeps a white shell white without clipping highlights
stage.appendChild(renderer.domElement);
renderer.domElement.addEventListener("webglcontextlost", () => viewerFail("The browser dropped the WebGL context. Reload the page."));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 200);
camera.position.set(2.6, 1.5, 2.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;

// Studio look: soft image-based light from a room environment, plus a key light for shadows.
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445066, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 6, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 20 });
scene.add(sun, sun.target);

const world = new THREE.Group(); // MuJoCo Z-up -> three Y-up
world.rotation.x = -Math.PI / 2;
scene.add(world);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.receiveShadow = true;
world.add(floor);
let grid;
function themeScene() {
  scene.background = new THREE.Color(css("--stage"));
  if (grid) world.remove(grid);
  grid = new THREE.GridHelper(400, 400, css("--grid"), css("--grid"));
  grid.rotation.x = Math.PI / 2;
  grid.material.transparent = true;
  grid.material.opacity = 0.55;
  world.add(grid);
  matGhost.uniforms.color.value.set(css("--source"));
}

// Ghost: an x-ray shell, nearly clear face-on and colored toward its silhouette, so the robot
// stays readable under it and the reference shows mainly where the two diverge. It draws its
// depth first, then its color on that nearest surface only.
const matGhost = new THREE.ShaderMaterial({
  uniforms: { color: { value: new THREE.Color() }, base: { value: 0.03 }, rim: { value: 0.9 } },
  vertexShader: `varying vec3 vN; varying vec3 vV;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `uniform vec3 color; uniform float base, rim; varying vec3 vN; varying vec3 vV;
    void main() {
      float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));
      gl_FragColor = vec4(color, base + rim * pow(f, 3.0));
      #include <colorspace_fragment>
    }`,
  transparent: true,
  depthWrite: false,
});
const matGhostDepth = new THREE.MeshBasicMaterial({ colorWrite: false });

// robot.glb: a root node (Y-up) whose children are the robot's bodies, named as in the MJCF,
// each holding its meshes. Here the bodies go under `world` and take MuJoCo poses directly.
function buildRobot(ghost) {
  const root = gltf.scene.children[0].clone(true);
  root.position.set(0, 0, 0);
  root.quaternion.identity();
  const byName = new Map(root.children.map((b) => [b.name, b]));
  const bodies = manifest.bodies.map((n) => byName.get(n) ?? new THREE.Group());
  const meshes = [];
  root.traverse((o) => o.isMesh && meshes.push(o));
  for (const m of meshes) {
    m.castShadow = !ghost;
    if (!ghost) continue;
    const depth = new THREE.Mesh(m.geometry, matGhostDepth);
    depth.position.copy(m.position);
    depth.quaternion.copy(m.quaternion);
    depth.scale.copy(m.scale);
    depth.renderOrder = 1;
    m.parent.add(depth);
    m.material = matGhost;
    m.renderOrder = 2;
  }
  world.add(root);
  return { root, bodies };
}
const robot = buildRobot(false);
const ghost = buildRobot(true);
themeScene();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeScene);
new MutationObserver(themeScene).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
document.getElementById("loading").hidden = true;
window.viewerReady = true;

// ---------------------------------------------------------------- playback
const state = { clip: 0, t: 0, playing: true, speed: 1, ghost: true, follow: true };
const fps = manifest.fps;
const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();
const pelvis = new THREE.Vector3(), lastPelvis = new THREE.Vector3();

function applyPose(clip, t) {
  const c = manifest.clips[clip];
  const f = Math.min(Math.max(t * fps, 0), c.frames - 1);
  const f0 = Math.floor(f), f1 = Math.min(f0 + 1, c.frames - 1), w = f - f0;
  const base = c.offset / 2;
  const set = (r, col) => {
    for (let b = 0; b < NB; b++) {
      const i0 = base + (f0 * 2 * NB + col + b) * 7, i1 = base + (f1 * 2 * NB + col + b) * 7;
      const body = r.bodies[b];
      body.position.set(
        (poses[i0] * (1 - w) + poses[i1] * w) / 1000,
        (poses[i0 + 1] * (1 - w) + poses[i1 + 1] * w) / 1000,
        (poses[i0 + 2] * (1 - w) + poses[i1 + 2] * w) / 1000,
      );
      qa.set(poses[i0 + 4], poses[i0 + 5], poses[i0 + 6], poses[i0 + 3]).normalize();
      qb.set(poses[i1 + 4], poses[i1 + 5], poses[i1 + 6], poses[i1 + 3]).normalize();
      body.quaternion.slerpQuaternions(qa, qb, w);
    }
  };
  set(ghost, 0);
  set(robot, NB);
  ghost.root.visible = state.ghost;
  const p = robot.bodies[0].position; // follow the root, in three's Y-up frame
  pelvis.set(p.x, p.z, -p.y);
}

// ---------------------------------------------------------------- UI
const $ = (id) => document.getElementById(id);
$("title").textContent = manifest.title;
document.title = manifest.title;
$("lg-robot").textContent = `${manifest.robot} policy`;
const [c0, c1] = manifest.swatch;
$("sw-robot").style.background = `linear-gradient(135deg, ${c0} 55%, ${c1 ?? c0} 55%)`;
const fell = manifest.clips.filter((c) => c.fell_at !== null).length;
$("meta").textContent = `${manifest.clips.length} motions · ${fell} fell`;
const list = $("clips");
manifest.clips.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "clip";
  b.type = "button";
  b.setAttribute("role", "listitem");
  b.innerHTML = `<i class="dot ${c.fell_at === null ? "good" : "bad"}"></i><span class="nm"></span><span class="dur"></span>`;
  b.querySelector(".nm").textContent = pretty(c.name);
  b.querySelector(".nm").title = c.name;
  b.querySelector(".dur").textContent = `${c.seconds.toFixed(0)} s`;
  b.addEventListener("click", () => selectClip(i));
  list.appendChild(b);
});

function renderStats(c) {
  const rows = [
    ["Outcome", c.fell_at === null ? "completed" : `fell at ${c.fell_at.toFixed(1)} s`],
    ["Root position error, mean", `${c.root_err_cm[0].toFixed(1)} cm`],
    ["Root position error, max", `${c.root_err_cm[1].toFixed(1)} cm`],
    ["Length shown", `${c.seconds.toFixed(1)} s`],
  ];
  $("stats").replaceChildren(...rows.flatMap(([k, v]) => {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k;
    dd.textContent = v;
    return [dt, dd];
  }));
}

function selectClip(i) {
  state.clip = i;
  state.t = 0;
  [...list.children].forEach((el, k) => el.setAttribute("aria-current", k === i ? "true" : "false"));
  list.children[i].scrollIntoView({ block: "nearest" });
  renderStats(manifest.clips[i]);
  applyPose(i, 0);
  const d = new THREE.Vector3().subVectors(pelvis, controls.target);
  d.y = 0;
  controls.target.add(d);
  camera.position.add(d);
  lastPelvis.copy(pelvis);
}

const dur = () => (manifest.clips[state.clip].frames - 1) / fps;
function setPlaying(p) {
  state.playing = p;
  $("play").textContent = p ? "Pause" : "Play";
}
$("play").addEventListener("click", () => setPlaying(!state.playing));
$("scrub").addEventListener("input", (e) => {
  state.t = (e.target.value / 1000) * dur();
  setPlaying(false);
});
$("speed").addEventListener("change", (e) => (state.speed = +e.target.value));
for (const k of ["ghost", "follow"]) {
  $(k).addEventListener("click", () => {
    state[k] = !state[k];
    $(k).setAttribute("aria-pressed", String(state[k]));
  });
}
addEventListener("keydown", (e) => {
  if (e.target.closest("input, select")) return;
  if (e.code === "Space") { e.preventDefault(); setPlaying(!state.playing); }
  if (e.code === "ArrowRight") { setPlaying(false); state.t = Math.min(dur(), state.t + 1 / fps); }
  if (e.code === "ArrowLeft") { setPlaying(false); state.t = Math.max(0, state.t - 1 / fps); }
  if (e.code === "ArrowDown") { e.preventDefault(); selectClip(Math.min(manifest.clips.length - 1, state.clip + 1)); }
  if (e.code === "ArrowUp") { e.preventDefault(); selectClip(Math.max(0, state.clip - 1)); }
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

selectClip(0);
let last = performance.now();
function followCamera() {
  if (state.follow) {
    const d = new THREE.Vector3().subVectors(pelvis, lastPelvis);
    d.y = 0;
    controls.target.add(d);
    camera.position.add(d);
  }
  lastPelvis.copy(pelvis);
  sun.position.set(controls.target.x + 3, 6, controls.target.z + 2);
  sun.target.position.copy(controls.target);
}
function loop(now) {
  // the first timestamp can predate `last`; a negative step would make the poses NaN
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now;
  if (state.playing) {
    state.t += dt * state.speed;
    if (state.t > dur()) state.t = 0;
  }
  applyPose(state.clip, state.t);
  followCamera();
  controls.update();
  $("scrub").value = String(Math.round((state.t / Math.max(dur(), 1e-6)) * 1000));
  $("time").textContent = `${state.t.toFixed(2)} / ${dur().toFixed(2)} s`;
  $("hud").textContent = `${manifest.clips[state.clip].name}  ·  frame ${Math.round(state.t * fps)}`;
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(loop);

// ---------------------------------------------------------------- MP4 export
// The current motion re-rendered offline from its start at 1080p / 50 fps with the current
// camera and follow setting, H.264-encoded with WebCodecs and muxed by mp4-muxer.
const VIDEO = { w: 1920, h: 1080, fps: 50, bitrate: 10e6 };
if (typeof VideoEncoder !== "undefined" && typeof Mp4Muxer !== "undefined") $("mp4").hidden = false;

async function videoConfig() {
  for (const codec of ["avc1.64002A", "avc1.4D002A", "avc1.42002A"]) {
    const cfg = { codec, width: VIDEO.w, height: VIDEO.h, bitrate: VIDEO.bitrate, framerate: VIDEO.fps, avc: { format: "avc" } };
    if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg;
  }
  throw new Error("this browser can't encode H.264 at 1080p");
}

let exporting = false;
async function exportMp4() {
  if (exporting) return;
  exporting = true;
  const btn = $("mp4");
  btn.disabled = true;
  const keep = { t: state.t, playing: state.playing, target: controls.target.clone(), cam: camera.position.clone() };
  const clip = state.clip, c = manifest.clips[clip];
  setPlaying(false);
  renderer.setAnimationLoop(null);
  try {
    const cfg = await videoConfig();
    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: "avc", width: VIDEO.w, height: VIDEO.h, frameRate: VIDEO.fps },
      fastStart: "in-memory",
    });
    let encError = null;
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => (encError = e) });
    enc.configure(cfg);
    renderer.setPixelRatio(1);
    renderer.setSize(VIDEO.w, VIDEO.h, false);
    camera.aspect = VIDEO.w / VIDEO.h;
    camera.updateProjectionMatrix();
    lastPelvis.copy(pelvis);
    applyPose(clip, 0);
    followCamera();
    const n = Math.floor(dur() * VIDEO.fps) + 1, us = 1e6 / VIDEO.fps;
    for (let i = 0; i < n; i++) {
      if (encError) throw encError;
      applyPose(clip, i / VIDEO.fps);
      followCamera();
      controls.update();
      renderer.render(scene, camera);
      const frame = new VideoFrame(renderer.domElement, { timestamp: Math.round(i * us), duration: Math.round(us) });
      enc.encode(frame, { keyFrame: i % (2 * VIDEO.fps) === 0 });
      frame.close();
      if (i % 10 === 0 || enc.encodeQueueSize > 6) {
        btn.textContent = `Rendering ${Math.round((100 * i) / n)}%`;
        await new Promise((r) => setTimeout(r, 0));
      }
    }
    await enc.flush();
    enc.close();
    if (encError) throw encError;
    muxer.finalize();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([muxer.target.buffer], { type: "video/mp4" }));
    a.download = `${c.name.replace(/[^\w.-]+/g, "_")}.mp4`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    btn.textContent = "Save MP4";
  } catch (e) {
    console.error(e);
    btn.textContent = "MP4 failed";
    setTimeout(() => (btn.textContent = "Save MP4"), 4000);
  } finally {
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    resize();
    controls.target.copy(keep.target);
    camera.position.copy(keep.cam);
    state.t = keep.t;
    applyPose(clip, state.t);
    lastPelvis.copy(pelvis);
    setPlaying(keep.playing);
    last = performance.now();
    renderer.setAnimationLoop(loop);
    btn.disabled = false;
    exporting = false;
  }
}
$("mp4").addEventListener("click", exportMp4);
</script>
